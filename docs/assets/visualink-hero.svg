<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Visualink turns a technical question into an interactive map</title>
  <desc id="desc">A dark interface showing a concise technical explanation, connected concepts, and guided chapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111c"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#07141a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 9 5 0 9Z" fill="#2dd4bf"/>
    </marker>
    <marker id="violetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 9 5 0 9Z" fill="#c084fc"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 9 5 0 9Z" fill="#fb8d62"/>
    </marker>
  </defs>

  <rect width="1600" height="800" rx="36" fill="url(#bg)"/>
  <circle cx="1320" cy="115" r="210" fill="#0ea5e9" opacity=".12" filter="url(#softGlow)"/>
  <circle cx="260" cy="700" r="180" fill="#8b5cf6" opacity=".12" filter="url(#softGlow)"/>

  <g transform="translate(88 72)">
    <circle cx="14" cy="14" r="8" fill="#67e8f9"/>
    <circle cx="42" cy="14" r="8" fill="#c084fc"/>
    <circle cx="28" cy="38" r="8" fill="#86efac"/>
    <path d="M20 16h14M18 21l7 11M38 21l-7 11" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <text x="66" y="32" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="750" letter-spacing="-1">Visualink</text>
  </g>

  <text x="88" y="158" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="750" letter-spacing="-1.6">
    See the concept. Understand the system.
  </text>
  <text x="88" y="200" fill="#aebdce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21">
    Turn a hard technical question into a clear, interactive map&#8212;without the wall of text.
  </text>

  <g transform="translate(88 248)" filter="url(#shadow)">
    <rect width="1424" height="448" rx="22" fill="#111923" stroke="#334155" stroke-width="2"/>
    <rect width="1424" height="64" rx="22" fill="#18212d"/>
    <path d="M0 64h1424" stroke="#334155" stroke-width="2"/>
    <circle cx="28" cy="32" r="6" fill="#fb7185"/>
    <circle cx="50" cy="32" r="6" fill="#fbbf24"/>
    <circle cx="72" cy="32" r="6" fill="#4ade80"/>
    <text x="108" y="39" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700">
      A technical concept, from question to system.
    </text>
    <rect x="1160" y="17" width="90" height="30" rx="15" fill="#0f172a" stroke="#475569"/>
    <text x="1183" y="37" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650" letter-spacing="1.5">EXPORT</text>
    <rect x="1262" y="17" width="138" height="30" rx="15" fill="#0f172a" stroke="#475569"/>
    <path d="M1284 26a7 7 0 1 0 9 9 6 6 0 0 1-9-9Z" fill="#e2e8f0"/>
    <text x="1305" y="37" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650" letter-spacing="1.5">DARK &#9662;</text>

    <text x="28" y="98" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700">
      Start with a precise answer, then see the parts, boundaries, and relationships around it.
    </text>
    <text x="28" y="123" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">
      Start with the answer. Then follow the connected pieces.
    </text>

    <g transform="translate(28 146)">
      <rect width="208" height="35" rx="17.5" fill="#f8fafc"/>
      <text x="25" y="23" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">01 &#183; Core idea</text>
      <rect x="220" width="194" height="35" rx="17.5" fill="#192332" stroke="#475569"/>
      <text x="245" y="23" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">02 &#183; Main parts</text>
      <rect x="426" width="190" height="35" rx="17.5" fill="#192332" stroke="#475569"/>
      <text x="451" y="23" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">03 &#183; Full flow</text>
    </g>

    <g transform="translate(86 218)">
      <rect x="0" y="10" width="174" height="70" rx="12" fill="#161f2b" stroke="#fb8d62" stroke-width="2"/>
      <text x="18" y="39" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">Your question</text>
      <text x="18" y="61" fill="#aebdce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">the starting point</text>

      <rect x="340" y="0" width="238" height="172" rx="16" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="358" y="26" fill="#d8b4fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CORE IDEA</text>
      <rect x="360" y="44" width="194" height="60" rx="11" fill="#161f2b" stroke="#c084fc" stroke-width="2"/>
      <text x="378" y="70" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700">Direct answer</text>
      <text x="378" y="90" fill="#aebdce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">what it means</text>
      <rect x="360" y="118" width="194" height="42" rx="11" fill="#161f2b" stroke="#c084fc"/>
      <text x="378" y="144" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650">Why it matters</text>

      <rect x="728" y="0" width="500" height="172" rx="16" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="746" y="26" fill="#86efac" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CONNECTED CONCEPTS</text>
      <rect x="754" y="55" width="176" height="66" rx="11" fill="#161f2b" stroke="#4ade80" stroke-width="2"/>
      <text x="772" y="83" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700">Main component</text>
      <text x="772" y="103" fill="#aebdce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">its role in the system</text>
      <rect x="1010" y="55" width="178" height="66" rx="11" fill="#161f2b" stroke="#4ade80" stroke-width="2"/>
      <text x="1028" y="83" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700">Related concept</text>
      <text x="1028" y="103" fill="#aebdce" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">how it connects</text>

      <path d="M174 45H360" stroke="#fb8d62" stroke-width="3" fill="none" marker-end="url(#orangeArrow)"/>
      <text x="234" y="35" fill="#fbab8d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">answer</text>
      <path d="M554 74H680V88H754" stroke="#c084fc" stroke-width="3" fill="none" marker-end="url(#violetArrow)"/>
      <text x="595" y="63" fill="#d8b4fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">expands into</text>
      <path d="M930 88H1010" stroke="#2dd4bf" stroke-width="3" fill="none" marker-end="url(#cyanArrow)"/>
      <text x="950" y="76" fill="#5eead4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">connects to</text>
    </g>
  </g>

  <g transform="translate(88 728)">
    <rect width="226" height="38" rx="19" fill="#172033" stroke="#334155"/>
    <text x="23" y="25" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650">1 &#183; Ask one question</text>
    <path d="M226 19H380" stroke="#475569" stroke-width="2"/>
    <path d="m372 13 8 6-8 6" fill="none" stroke="#475569" stroke-width="2"/>
    <rect x="396" width="246" height="38" rx="19" fill="#172033" stroke="#334155"/>
    <text x="419" y="25" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650">2 &#183; See the full picture</text>
    <path d="M654 19h54" stroke="#475569" stroke-width="2"/>
    <path d="m700 13 8 6-8 6" fill="none" stroke="#475569" stroke-width="2"/>
    <rect x="724" width="254" height="38" rx="19" fill="#172033" stroke="#334155"/>
    <text x="747" y="25" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650">3 &#183; Learn step by step</text>
  </g>
</svg>
